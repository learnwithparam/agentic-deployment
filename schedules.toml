# Parts mapped onto formats. Minutes are for the median learner. Times live only in this file.
# Content: orientation 15, ship-the-desk 55, see-every-run 35, bound-the-runs 85, release-safely 90,
# wrap-up 10 (bun run verify --report), go-further 115 (stretch, optional),
# deploy-the-agent-to-cloud-run-with-floci-gcp 30 (closing, optional).

# The Maven workshop: one sitting of 280 minutes, breaks added by the host. The stretch part is homework.
[one-day]
sessions = [
  { name = "the workshop", parts = ["orientation", "ship-the-desk", "see-every-run", "bound-the-runs", "release-safely"], minutes = 280 },
  { name = "after the workshop", parts = ["go-further", "deploy-the-agent-to-cloud-run-with-floci-gcp"], minutes = 145 },
]

# Four evenings of 70 to 85 minutes.
[four-evenings]
sessions = [
  { name = "evening 1", parts = ["orientation", "ship-the-desk"], minutes = 70 },
  { name = "evening 2", parts = ["see-every-run", "bound-the-runs"], minutes = 120 },
  { name = "evening 3", parts = ["release-safely"], minutes = 90 },
  { name = "evening 4", parts = ["go-further", "deploy-the-agent-to-cloud-run-with-floci-gcp"], minutes = 145 },
]

# A cohort over four weeks: one part a week, with the assignment from each part handed in on a branch.
[four-weeks]
sessions = [
  { name = "week 1", parts = ["orientation", "ship-the-desk"], minutes = 90 },
  { name = "week 2", parts = ["see-every-run", "bound-the-runs"], minutes = 120 },
  { name = "week 3", parts = ["release-safely"], minutes = 95 },
  { name = "week 4", parts = ["go-further", "deploy-the-agent-to-cloud-run-with-floci-gcp"], minutes = 145 },
]
