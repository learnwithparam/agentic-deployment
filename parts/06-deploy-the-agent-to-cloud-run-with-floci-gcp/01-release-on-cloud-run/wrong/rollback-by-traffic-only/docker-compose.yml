# The emulator for Google Cloud: Cloud Run and Secret Manager on port 4588. No account, no key.
# It starts your service containers through the Docker socket, so the socket is mounted.
name: floci-cloud-run
services:
  floci-gcp:
    image: floci/floci-gcp:0.12.0
    ports: ["4588:4588"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
